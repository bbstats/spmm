[project]
name = "eracoef"
version = "0.1.0"
description = "era-coefs: how NBA box-score coefficients drift across eras (mixed-model RAPM)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pyarrow>=14",
  "scikit-learn>=1.4",
  "plotly>=5.18",
  "matplotlib>=3.8",
  "nba_api>=1.4",
  "pyyaml>=6",
  "kaleido>=0.2.1",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

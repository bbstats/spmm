# era-coefs configuration. Every script reads this; nothing is hard-coded elsewhere.

# Seasons are named by the year they end (1997 = 1996-97).
first_season: 1997
last_season: 2026
windows:              # ten non-overlapping 3-season windows
  - [1997, 1999]
  - [2000, 2002]
  - [2003, 2005]
  - [2006, 2008]
  - [2009, 2011]
  - [2012, 2014]
  - [2015, 2017]
  - [2018, 2020]
  - [2021, 2023]
  - [2024, 2026]
rolling_step: 1       # rolling 3-year windows for the robustness overlay
neutral_site_seasons_po: [2020]   # 2020 bubble playoffs: home = 0

features: [fg3m, fg3_miss, fg2m, fg2_miss, ftm, ft_miss, orb, drb, ast, tov, stl, blk, pf]

# Regularization. lam / lam_ratio are chosen once (03_cv.py) and used in every window.
# chosen once by scripts/03_cv.py on 2000-02 and 2012-14 (RS rows), written to outputs/lambda.yaml.
# Re-tuned under player_unit: window (possessions per unit roughly triple).
lam_beta: 10149.5        # ridge on the two cross-fitted half-fits (beta)
lam_ratio_beta: 0.5      # lambda_D / lambda_O there
lam_plugin: 18351.8      # ridge on the plug-in ratings fit (u given beta)
lam_ratio_plugin: 0.2872 # lambda_D / lambda_O there; REML tau2_O 0.66 vs tau2_D 2.3
lam_buckets: {}       # e.g. {low_poss: 2.0}; only add after the calibration-by-bucket test says so
# Which box prior the shipped ratings shrink toward, per side.
#   offense: player  the prior priced to predict a PLAYER (windows.player_priced_beta), not a team.
#   defense: none    no box prior at all -- the box score has no defensive vocabulary (R^2 0.26 of a
#                    player's rates on his own defensive on-court impact), and pure RAPM beats the
#                    box-primed defensive rating 0.877 to 0.755.  See scripts/30_ladder.py.
# Both sides use lam_plugin / lam_ratio_plugin above; the defensive knob is NOT re-tuned here.  The
# ladder's internal criterion (next-window on-court impact) cannot select it: it is flat across the
# weakest four penalties and then declines, so it has no interior optimum and just runs to the weak
# end, because the benchmark shares the estimate's blind spot.  See scripts/33_hybrid.py.
ratings_prior:
  offense: player
  defense: none
  boost: false        # the boosted correction is worth 0 on total and -0.020 on offense (30_ladder)
# The random effect unit: "window" gives one player effect per 3-season window, "season" one per
# player-season (the original spec).  Possession thresholds below are in the unit's own scale.
player_unit: window
low_poss_threshold: 1500  # player-windows under this many RS possessions form the "low_poss" group
starter_poss_threshold: 4500  # and at or above this many form "high_poss" (the starter bucket)
lam_delta: null       # playoff block ridge; null = no delta block. Chosen by 03_cv.py step 7.
lam_grid: {start: 100, stop: 60000, num: 28, log: true}
lam_ratio_grid: [0.25, 0.33, 0.5, 0.75, 1.0, 1.5, 2.0]
lam_delta_grid: [1e2, 3e2, 1e3, 3e3, 1e4, 3e4, 1e5, 1e6]
pad_k: auto           # or a per-feature dict override, e.g. {stl: 400, blk: 600}
boost_min_poss: 4500     # the booster trains only above this; it scores everyone
boost_quality: null      # ChimeraBoost quality 1-5; null = library default (3)
# Playing time as a booster feature, per side.  It is frozen at the training reference when
# scoring, so it only ever absorbs role effects; it never reaches a rating.  Against five
# stratified permutation nulls, defence gains from it (margin 0.57 over a null of 0.015, against
# 0.48 over 0.097 without) and offence loses (0.61 over 0.037 with, against 0.80 over 0.069).
boost_nuisance:
  O: []
  D: [poss_rank]
pad_target: poss_conditional   # chosen at checkpoint 4 (bench prior calibration); league | poss_conditional (padding target for the EB shrinkage of the rates)
pad_scale_grid: [0.5, 1.0, 2.0]
min_half_poss: 20     # a split half needs at least this many possessions to enter the k estimate

# Garbage time and rubber band.
garbage_time:
  q4_margin_late: 15    # 4th quarter, margin >= 15 with under `late_minutes` left
  late_minutes: 6
  q4_margin_any: 20     # or margin >= 20 at any point in the 4th
gt_weight: 1.0
gt_weight_robustness: [0.5, 0.0]
margin_clip: 25
margin_bins: [-25, -15, -8, -3, 3, 8, 15, 25]   # 7 bins for the binned-margin robustness run
time_halves: 2

cv:
  n_folds: 5
  seed: 0
  lambda_windows: [[2000, 2002], [2012, 2014]]   # MixedModelRAPMCV on these two, RS only
  validation_window: [2012, 2014]
  poss_buckets: [0, 1500, 4500, 1000000]

# The out-of-season criterion (src/eracoef/holdout.py, scripts/45_holdout.py): hold out one season,
# train on the K nearest seasons either side of it, predict its stints, score against actual points.
# The one test in this project that is both external to the model and legal to select on.
holdout:
  first: 1998            # held-out seasons; 1997 and 2026 have neighbours on one side only
  last: 2025
  ks: [2, 4]             # training seasons around the held-out one: K=2 is {H-1, H+1}
  lam: null              # null = lam_plugin; a list sweeps
  level: home            # refit on the held-out season: "home" = intercept + home (what every earlier
                         # script used); "full" = the whole fixed block (margin, garbage time, playoffs)
  rank_bins: 10          # rank-calibration deciles
  rank_min_poss: 1000    # a player needs this many training possessions to be ranked
  exposure_edges: [0, 1, 500, 1500, 4000, 1000000000]   # the --splits=exposure bins (smallest exposure on the floor)
  consensus:
    window: [2024, 2026]
    min_poss: 1000

paths:
  raw: data/raw
  stints: data/stints
  box: data/box
  outputs: outputs
  figs: outputs/figs
  lambda_file: outputs/lambda.yaml
  coefs: outputs/coefs.parquet

run_tags: [base, lam_x3, lam_div3, rolling, gt_half, gt_zero, margin_bins]
